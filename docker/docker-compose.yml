# The development stack: one Postgres that the admin panel owns, and an
# S3-compatible store for the media library.
#
# Ports are deliberately off the defaults. This machine already runs Postgres
# on 5432, another project's stack on 4532/4910/4911, and a third on 5435;
# 6012–6014 sit next to the two apps (6010/6011) and collide with nothing.
name: lotuspeak

services:
  postgres:
    image: postgres:16-alpine
    container_name: lotuspeak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lotuspeak
      POSTGRES_PASSWORD: lotuspeak
      POSTGRES_DB: lotuspeak
    ports:
      - '6012:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lotuspeak -d lotuspeak']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible storage, so the admin panel exercises the same S3
  # driver in development that it uses in production. The website never talks
  # to this: it renders the absolute URLs the public API hands it.
  minio:
    image: quay.io/minio/minio:latest
    container_name: lotuspeak_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '6013:9000'
      - '6014:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio' && sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/lotuspeak-media;
      /usr/bin/mc anonymous set download local/lotuspeak-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
