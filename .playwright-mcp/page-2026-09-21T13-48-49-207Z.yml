          - generic [ref=f313e211]: "04"
          - generic [ref=f313e213]: Living tradition
        - heading "Arts, crafts and Jomzo" [level=2] [ref=f313e215]
        - generic [ref=f313e217]:
          - paragraph [ref=f313e218]: Jomzo is the Bhutanese art of shaping clay, copper and gold into sacred statues, finished with unusual precision. We arrange time with artisans at work, in workshops and living exhibitions, so you meet the culture as a participant rather than an onlooker.
          - paragraph [ref=f313e219]: "Festival journeys are timed to a tshechu: masked dances in a dzong courtyard, the whole valley in its finest kira and gho."
