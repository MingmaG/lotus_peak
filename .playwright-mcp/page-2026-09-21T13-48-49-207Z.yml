    - generic [ref=f313e240]:
      - generic [ref=f313e242]:
        - generic [ref=f313e243]: "05"
        - generic [ref=f313e245]: When to come
      - heading "Each season keeps its own appointments" [level=2] [ref=f313e247]
      - paragraph [ref=f313e249]: Other than the deep monsoon weeks, there is no wrong time. Spring and autumn for clear skies and festivals, winter for the cranes, summer for green and quiet.
      - generic [ref=f313e250]:
        - generic [ref=f313e251]:
          - generic [ref=f313e252]:
            - generic [ref=f313e253]: Mar – May
            - generic [ref=f313e255]: Spring
          - generic [ref=f313e256]:
            - heading "Clear skies and festivals" [level=3] [ref=f313e257]
            - paragraph [ref=f313e258]: Rhododendrons in the forests above Paro. Tshechus in the dzong courtyards. The high passes open again.
            - generic [ref=f313e259]:
              - region "Read more":
                - paragraph [ref=f313e261]: Spring arrives in early March and the valleys warm quickly, from around 6 °C at midday at the start of the season to 15–20 °C by May. Nights stay cool, near freezing in March and around 9 °C by May. The mountains hold their snow until late spring, and rain builds slowly, from four wet days in March to nine in May. Paro Tshechu falls in this window, as do Shabdrung Kuchoe in late April and Lord Buddha’s Parinirvana at the end of May.
              - button "Read more" [ref=f313e262] [cursor=pointer]
          - img "A whitewashed prayer tower on a green hillside, with ridge behind ridge into the distance" [ref=f313e268]
        - generic [ref=f313e269]:
          - generic [ref=f313e270]:
            - generic [ref=f313e271]: Jun – Aug
            - generic [ref=f313e273]: Summer
          - generic [ref=f313e274]:
            - heading "Green and quiet" [level=3] [ref=f313e275]
            - paragraph [ref=f313e276]: The monsoon softens everything. Valleys are at their greenest and the trails are ours alone.
            - generic [ref=f313e277]:
              - region "Read more":
                - paragraph [ref=f313e279]: The monsoon runs from June to August. In the central valleys days sit at 21–22 °C and nights around 13–14 °C, with rain on most days and July the wettest month. The south is hot and humid; the high country stays cool. Rice terraces are at their greenest, rivers run full, and the trails are almost empty. The birth anniversary of Guru Rinpoche in late June and the First Sermon of Lord Buddha in mid-July are the season’s observances.
              - button "Read more" [ref=f313e280] [cursor=pointer]
          - img "Punakha Dzong between its two rivers in summer, the valley green under heavy cloud" [ref=f313e286]
        - generic [ref=f313e287]:
          - generic [ref=f313e288]:
            - generic [ref=f313e289]: Sep – Nov
            - generic [ref=f313e291]: Autumn
          - generic [ref=f313e292]:
            - heading "The clearest light" [level=3] [ref=f313e293]
            - paragraph [ref=f313e294]: Harvest in the fields, Jomolhari sharp against the sky. The season for the long walk.
            - generic [ref=f313e295]:
              - region "Read more":
                - paragraph [ref=f313e297]: September still carries the tail of the monsoon, then the sky clears. October brings 19 °C days, cold 7 °C nights and only a handful of wet days; November is drier still, with almost no rain and nights near freezing. The high peaks stand sharp against blue sky, which makes this the season for Jomolhari. Thimphu Tshechu in mid-September, Blessed Rainy Day, the Descending Day of Lord Buddha and National Day preparations fill the calendar.
              - button "Read more" [ref=f313e298] [cursor=pointer]
          - img "A dzong above the river in autumn, with turning trees and dry stone banks" [ref=f313e304]
        - generic [ref=f313e305]:
          - generic [ref=f313e306]:
            - generic [ref=f313e307]: Dec – Feb
            - generic [ref=f313e309]: Winter
          - generic [ref=f313e310]:
            - heading "The cranes return" [level=3] [ref=f313e311]
            - paragraph [ref=f313e312]: Black-necked cranes winter in Phobjikha. Cold mornings, still air, and empty temples.
            - generic [ref=f313e313]:
              - region "Read more":
                - paragraph [ref=f313e315]: Winter is sunny and dry. Days reach 11–12 °C in the western valleys, nights fall to around -2 °C, and rain is rare. Snow closes stretches of the east–west highway, so this is the time for Paro, Thimphu, Punakha, Wangdue and Haa. Black-necked cranes settle in Phobjikha, and the temples are quiet. National Day on 17 December, Nyilo at the solstice, the Traditional Day of Offering in January and Losar in February mark the season.
              - button "Read more" [ref=f313e316] [cursor=pointer]
          - img "Paro Dzong on the valley floor beneath snow-covered peaks in clear winter air" [ref=f313e322]
